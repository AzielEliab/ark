name = "ark-download-tracker"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

[[kv_namespaces]]
binding = "DOWNLOADS"
id = "c7305a73417348f6ad41a3529f0d0235"

[vars]
AZIEL_RUNTIME_ORIGIN = "https://aziel-runtime.vibelock.workers.dev"

# Worker→Worker public fetch of aziel-runtime can return HTML/404.
# Proxy via env.AZIEL_RUNTIME.fetch(new Request("https://aziel-runtime/v1/mesh/…")).
# Hostname is a placeholder (not DNS). HTTP fallback only when unbound.
# Mesh paths are never rewritten onto /v1/fraggate.
[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

[assets]
directory = "./public"
binding = "ASSETS"
# /v1/* covers /v1/mesh/* (AZIEL_RUNTIME proxy) and local /v1/{op}.
run_worker_first = ["/", "/install.sh", "/install.sh/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/v1", "/v1/*", "/openapi.json", "/ai", "/ai/*", "/mcp", "/mcp/", "/robots.txt", "/sitemap.xml", "/cite.json"]
