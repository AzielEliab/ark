[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ark"
version = "0.1.0"
description = "The ARK (Aziel Rotating Kernel): local deniable vault. Not a kernel. Every phrase is a login."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "vault",
    "deniable",
    "aes-gcm",
    "argon2id",
    "hkdf",
    "ark",
    "local",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23",
    "blake3>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ark = "ark.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/ark"
Download = "https://github.com/AzielEliab/ark/releases"
Issues = "https://github.com/AzielEliab/ark/issues"
Counted-downloads = "https://ark-download-tracker.vibelock.workers.dev/"

[tool.setuptools.packages.find]
include = ["ark*"]

[tool.setuptools.package-data]
ark = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
